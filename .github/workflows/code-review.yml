name: Daily code verification reminder
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: code-verification-reminder
  cancel-in-progress: false
jobs:
  reminder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/verify-reminder.ts > reminder.md
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = 'Daily First Person Boxing code verification';
            const body = fs.readFileSync('reminder.md', 'utf8');
            const issues = await github.paginate(github.rest.issues.listForRepo, {...context.repo, state: 'open', creator: 'github-actions[bot]', per_page: 100});
            const existing = issues.find(i => i.title === title && !i.pull_request);
            if (existing) await github.rest.issues.update({...context.repo, issue_number: existing.number, body});
            else await github.rest.issues.create({...context.repo, title, body});
