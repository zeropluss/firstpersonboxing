<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="t d"><title id="t">A practice sequence: observe, defend, respond, reset</title><desc id="d">Editorial diagram, not an in-game screenshot. Four steps connected across a boxing ring.</desc><rect width="1000" height="560" fill="#1b1e1b"/><path d="M48 58H952V502H48z" fill="none" stroke="#657047" stroke-width="4"/><path d="M95 110H905V450H95z" fill="none" stroke="#dcfb59" stroke-width="2"/><path d="M300 280H700" stroke="#abb0a5" stroke-width="2" stroke-dasharray="8 12"/><g font-family="Arial" text-anchor="middle"><g fill="#dcfb59" font-size="15" font-weight="700"><text x="180" y="210">01 / OBSERVE</text><text x="390" y="210">02 / DEFEND</text><text x="610" y="210">03 / RESPOND</text><text x="820" y="210">04 / RESET</text></g><g fill="#f1f0e7" font-size="23" font-weight="700"><text x="180" y="270">Read the</text><text x="180" y="300">exchange</text><text x="390" y="270">Slip or use</text><text x="390" y="300">the right guard</text><text x="610" y="270">Try one</text><text x="610" y="300">counter</text><text x="820" y="270">Watch stamina</text><text x="820" y="300">and recover</text></g><g fill="#abb0a5" font-size="14"><text x="500" y="528">EDITORIAL PRACTICE MODEL · NOT AN IN-GAME SCREENSHOT · NO TIMING DATA IMPLIED</text></g></g><g fill="#dcfb59"><circle cx="180" cy="370" r="8"/><circle cx="390" cy="370" r="8"/><circle cx="610" cy="370" r="8"/><circle cx="820" cy="370" r="8"/></g></svg>
